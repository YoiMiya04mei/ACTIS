services:
  # ==============================================================================
  # SERVICE 1: PostgreSQL 16 Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: actis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-actis_db}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-actis_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================================
  # SERVICE 2: ACTIS Web Application (Next.js Standalone)
  # ==============================================================================
  actis-app:
    container_name: actis-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ACTIS_GIT_COMMIT: ${ACTIS_GIT_COMMIT:-}
        ACTIS_GIT_BRANCH: ${ACTIS_GIT_BRANCH:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
      - "${TACACS_PORT:-49}:${TACACS_PORT:-49}"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TACACS_PORT=${TACACS_PORT:-49}
      - HOSTNAME=0.0.0.0
      # Koneksi internal container ke service postgres (port 5432 internal)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-actis_db}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - GOOGLE_APPS_SCRIPT_WEBHOOK_URL=${GOOGLE_APPS_SCRIPT_WEBHOOK_URL}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - INITIAL_SEED=${INITIAL_SEED:-false}
      - SKIP_DB_SYNC=${SKIP_DB_SYNC:-false}
    volumes:
      # Persistent Volume untuk File Hasil Upload (Evidence Uji Jaringan, Speedtest, PDF)
      - ./uploads:/app/public/uploads
      # Persistent Volume untuk data aplikasi lokal (activity_logs.json & staging update bundle)
      - app_data:/app/data
      # Persistent Volume untuk staging file source .zip agar bisa dibaca host VPS
      - ./updates:/app/updates
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persistent volume PostgreSQL agar data transaksi NOC & inventaris aman
  postgres_data:
    name: actis_postgres_data
  # Persistent volume data lokal aplikasi (activity_logs.json)
  app_data:
    name: actis_app_data
